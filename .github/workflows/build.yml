name: Build Signed APK with Expo (Bare Workflow)

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Check out code
        uses: actions/checkout@v6

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          npm install

      # 4. Run expo prebuild (this generates the android/ folder)
      - name: Run expo prebuild
        run: npx expo prebuild --clean

      # 5. Set up JDK 17 (required for building Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adoptopenjdk'

      # 6. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
            cmdline-tools-version: 12266719

      # 7. Build the APK with Gradle
      - name: Build APK
        run: ./android/gradlew assembleRelease --stacktrace

      # 8. Upload the APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk