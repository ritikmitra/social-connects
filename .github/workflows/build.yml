name: Build APK with Expo (Bare Workflow)

on:
  push:
    branches:
      - dev
      - beta

jobs:
  build:
    runs-on: ubuntu-latest

    env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
        EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

    steps:
      # 1. Check out the repository
      - name: Check out code
        uses: actions/checkout@v6

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          npm ci

      # 4. Decode Google Services JSON
      - name: Decode Google Services JSON
        run: |
          printf "%s" "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > ./google-services.json

      # 5. Run expo prebuild (this generates the android/ folder)
      - name: Run expo prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      # 6. Set up JDK 17 (required for building Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
            distribution: 'temurin'
            java-version: '17'
            cache: 'gradle'

      # 7. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
            cmdline-tools-version: 14742923

      # 8. Build the APK with Gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --no-daemon --build-cache --stacktrace

      # 9. Sign APK
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "36.0.0"
      
      # 10. Upload the signed APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          overwrite: true
