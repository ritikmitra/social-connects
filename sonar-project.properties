# --- Project identification ---
sonar.projectKey=my_expo_project
sonar.projectName=My Expo Project
sonar.projectVersion=1.0.0

# --- Source settings ---
sonar.sources=.
sonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx
sonar.tests=.
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# --- Encoding ---
sonar.sourceEncoding=UTF-8

# --- Exclusions ---
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/android/**,**/ios/**,**/__tests__/**

# --- Coverage reports ---
# Assuming you use Jest for tests and coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Optional: linting reports (ESLint) ---
sonar.javascript.eslint.reportPaths=eslint-report.json

# --- Language ---
sonar.language=js
